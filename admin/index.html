<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deadpoint — Admin</title>
<!--
  Private by RLS + a SECURITY DEFINER admin gate on the Supabase side
  (see SUPABASE.md's "Admin dashboard" section), not by this page's URL
  being unlisted — anyone can load this file, but every read it makes
  fails with "not authorized" unless they can actually sign in as the
  one admin email the database itself checks. Reuses the exact OTP
  sign-in flow app.js already uses (signInWithOtp -> verifyOtp with a
  6-digit code), same SUPABASE_URL/ANON as everywhere else in this repo
  — the anon key is meant to be public, per SUPABASE.md's own note on
  anon vs service_role.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #181B22; --s1: #1E222B; --s2: #272C37; --s3: #333947; --s4: #454C5C;
    --fg: #EDEBE5; --dim: #9AA0AE; --faint: #666C7A;
    --gorse: #F2B134; --tidepool: #4FB3A5; --slate: #7B93E0; --heather: #C9739B; --grey: #5A6069;
    --go: #1FA24A; --err: #D6383D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "SF Mono", "Roboto Mono", ui-monospace, monospace; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .eyebrow {
    font: 700 11px/1 "SF Mono", monospace; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--faint); margin: 0 0 6px;
  }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .whoami { font-size: 13px; color: var(--dim); }
  .whoami span { color: var(--fg); }
  button {
    font: 700 13px/1 "SF Mono", monospace; color: var(--dim); background: var(--s1);
    border: 1px solid var(--s3); border-radius: 6px; padding: 9px 16px; cursor: pointer;
  }
  button:hover { color: var(--fg); border-color: var(--s4); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--tidepool); color: #0e1512; border-color: var(--tidepool); }
  button.primary:hover { color: #0e1512; filter: brightness(1.08); }
  input {
    font: 15px/1 -apple-system, sans-serif; color: var(--fg); background: var(--s1);
    border: 1px solid var(--s3); border-radius: 6px; padding: 12px 14px; width: 100%;
  }
  input:focus { outline: none; border-color: var(--slate); }

  /* Sign-in */
  .auth { max-width: 380px; margin: 15vh auto 0; }
  .auth p { color: var(--dim); font-size: 13px; margin: 8px 0 20px; }
  .auth .field { margin-bottom: 12px; }
  .auth .error { color: var(--err); font-size: 13px; margin-top: 10px; }

  /* Summary strip */
  .stats { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat { background: var(--s1); border: 1px solid var(--s3); border-radius: 10px; padding: 14px 18px; flex: 1; min-width: 120px; }
  .stat .n { font: 800 26px/1 "SF Mono", monospace; }
  .stat .l { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  /* User table */
  table { width: 100%; border-collapse: collapse; background: var(--s1); border-radius: 10px; overflow: hidden; border: 1px solid var(--s3); }
  th { text-align: left; font: 700 11px/1 "SF Mono", monospace; letter-spacing: 1px; text-transform: uppercase;
       color: var(--faint); padding: 12px 16px; border-bottom: 1px solid var(--s3); }
  td { padding: 13px 16px; border-bottom: 1px solid var(--s2); font-size: 14px; }
  tr.userrow { cursor: pointer; }
  tr.userrow:hover td { background: var(--s2); }
  tr.userrow.open td { background: var(--s2); }
  tr:last-child td { border-bottom: none; }
  .email { font-weight: 600; }
  .num { font-family: "SF Mono", monospace; text-align: right; }
  .pill {
    display: inline-block; font: 700 10px/1 "SF Mono", monospace; letter-spacing: 0.5px;
    padding: 4px 8px; border-radius: 4px; background: var(--s2); color: var(--dim); border: 1px solid var(--s3);
  }
  .pill.builtin { color: var(--gorse); border-color: color-mix(in srgb, var(--gorse) 40%, transparent); }
  .muted { color: var(--faint); }

  /* Detail panel */
  .detail { background: var(--s1); border: 1px solid var(--s3); border-top: none; border-radius: 0 0 10px 10px; padding: 20px; margin-top: -12px; margin-bottom: 12px; }
  .detail h3 { font-size: 13px; margin: 0 0 14px; color: var(--dim); font-weight: 700; }
  .grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 3px; overflow-x: auto; padding-bottom: 6px; }
  .cell { width: 13px; height: 13px; border-radius: 3px; background: var(--s2); border: 1px solid var(--s3); }
  .legend { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; font-size: 11px; color: var(--faint); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .recent { margin-top: 18px; }
  .recent-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--s2); }
  .recent-row:last-child { border-bottom: none; }
  .loading, .empty { color: var(--faint); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script>
var SUPABASE_URL  = 'https://lbhsgkadlhcqqnlbfswr.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiaHNna2FkbGhjcXFubGJmc3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNTg2NzMsImV4cCI6MjEwMTkzNDY3M30.3Df2BW9YVfJYZVSalLWGsx54iY_RvnZdln71Kehljug';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
var app = document.getElementById('app');

// Same visual language as the app itself (SessionColours.swift) — an
// admin tool has no reason to invent its own palette. Session types
// beyond these seven (a future template with different keys) fall back
// to --grey rather than guessing.
var SESSION_COLOUR = {
  maxFingers: '--gorse', hangboard: '--slate', pull: '--tidepool',
  climbHard: '--heather', outdoorHard: '--heather', climbEasy: '--tidepool', rest: '--grey'
};
function colourFor(type) {
  var v = SESSION_COLOUR[type] || '--grey';
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}

function esc(s) { return (s || '').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); }
function daysAgo(d) {
  if (!d) return null;
  return Math.round((Date.now() - new Date(d).getTime()) / 86400000);
}

// ---- Auth ----

function renderSignIn(stage, email, error) {
  stage = stage || 'email';
  app.innerHTML =
    '<div class="auth">' +
      '<p class="eyebrow">Deadpoint</p>' +
      '<h1>Admin sign-in</h1>' +
      '<p>Same private account used for the app itself — this page just refuses to show anything unless that account is the one admin email the database checks.</p>' +
      (stage === 'email'
        ? '<div class="field"><input id="email" type="email" placeholder="you@example.com" autocomplete="email" value="' + esc(email || '') + '"></div>' +
          '<button class="primary" id="sendBtn" style="width:100%">SEND CODE</button>'
        : '<div class="field"><input id="code" type="text" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code"></div>' +
          '<button class="primary" id="verifyBtn" style="width:100%">SIGN IN</button>') +
      (error ? '<p class="error">' + esc(error) + '</p>' : '') +
    '</div>';

  if (stage === 'email') {
    document.getElementById('sendBtn').onclick = function () {
      var em = document.getElementById('email').value.trim();
      if (!em) return;
      this.disabled = true; this.textContent = 'SENDING…';
      sb.auth.signInWithOtp({ email: em }).then(function (res) {
        if (res.error) { renderSignIn('email', em, res.error.message); return; }
        renderSignIn('code', em);
      });
    };
  } else {
    document.getElementById('verifyBtn').onclick = function () {
      var code = document.getElementById('code').value.trim();
      if (!code) return;
      this.disabled = true; this.textContent = 'CHECKING…';
      sb.auth.verifyOtp({ email: email, token: code, type: 'email' }).then(function (res) {
        if (res.error) { renderSignIn('code', email, res.error.message); return; }
        boot();
      });
    };
  }
}

// ---- Dashboard ----

var currentUsers = [];
var openRow = null;

function renderDashboard(users, whoami) {
  currentUsers = users;
  var loggedAtLeastOnce = users.filter(function (u) { return u.sessions_logged > 0; }).length;
  var activeThisWeek = users.filter(function (u) { var d = daysAgo(u.last_session_date); return d !== null && d <= 7; }).length;

  var rows = users.map(function (u, i) {
    var lastActiveDays = daysAgo(u.last_session_date);
    var lastActiveLabel = u.last_session_date
      ? (lastActiveDays === 0 ? 'Today' : lastActiveDays + 'd ago')
      : '—';
    var tierPill = u.assigned_template_id
      ? '<span class="pill">' + esc(u.tier || 'standard') + '</span>'
      : '<span class="pill builtin">BUILT-IN</span>';
    return (
      '<tr class="userrow" data-i="' + i + '">' +
        '<td class="email">' + esc(u.email) + '</td>' +
        '<td class="muted">' + fmtDate(u.signed_up_at) + '</td>' +
        '<td>' + tierPill + '</td>' +
        '<td class="num">' + u.sessions_logged + '</td>' +
        '<td class="muted">' + lastActiveLabel + (u.last_session_type ? ' · ' + esc(u.last_session_type) : '') + '</td>' +
      '</tr>' +
      '<tr class="detailrow" data-detail="' + i + '" style="display:none"><td colspan="5" style="padding:0;border:none"><div class="detail" id="detail-' + i + '"></div></td></tr>'
    );
  }).join('');

  app.innerHTML =
    '<div class="topbar">' +
      '<div><p class="eyebrow">Deadpoint</p><h1>Admin</h1></div>' +
      '<div style="text-align:right">' +
        '<div class="whoami">Signed in as <span>' + esc(whoami) + '</span></div>' +
        '<button id="signOutBtn" style="margin-top:8px">SIGN OUT</button>' +
      '</div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="n">' + users.length + '</div><div class="l">Signed up</div></div>' +
      '<div class="stat"><div class="n">' + loggedAtLeastOnce + '</div><div class="l">Have logged a session</div></div>' +
      '<div class="stat"><div class="n">' + activeThisWeek + '</div><div class="l">Active this week</div></div>' +
    '</div>' +
    (users.length === 0
      ? '<div class="empty">Nobody\'s signed up yet.</div>'
      : '<table><thead><tr><th>Email</th><th>Signed up</th><th>Tier</th><th style="text-align:right">Sessions</th><th>Last active</th></tr></thead><tbody>' + rows + '</tbody></table>'
    ) +
    '<p class="muted" style="font-size:12px;margin-top:16px">Subscription status isn\'t shown — it\'s checked client-side only right now (StoreKit, on-device), so there\'s no row in the database recording who\'s actually paying yet. Real subscriber counts live in App Store Connect.</p>';

  document.getElementById('signOutBtn').onclick = function () { sb.auth.signOut().then(boot); };

  document.querySelectorAll('.userrow').forEach(function (tr) {
    tr.onclick = function () { toggleDetail(parseInt(tr.getAttribute('data-i'), 10)); };
  });
}

function toggleDetail(i) {
  var row = document.querySelector('.userrow[data-i="' + i + '"]');
  var detailRow = document.querySelector('.detailrow[data-detail="' + i + '"]');
  if (openRow !== null && openRow !== i) {
    document.querySelector('.userrow[data-i="' + openRow + '"]').classList.remove('open');
    document.querySelector('.detailrow[data-detail="' + openRow + '"]').style.display = 'none';
  }
  if (openRow === i) {
    row.classList.remove('open'); detailRow.style.display = 'none'; openRow = null;
    return;
  }
  row.classList.add('open'); detailRow.style.display = ''; openRow = i;
  loadDetail(currentUsers[i]);
}

function loadDetail(user) {
  var el = document.getElementById('detail-' + currentUsers.indexOf(user));
  el.innerHTML = '<div class="loading">Loading history…</div>';
  sb.rpc('admin_user_sessions', { target_user_id: user.user_id }).then(function (res) {
    if (res.error) { el.innerHTML = '<div class="empty">' + esc(res.error.message) + '</div>'; return; }
    el.innerHTML = renderHistory(res.data || [], user);
  });
}

// A small, real preview of the "GitHub-calendar" idea — last 18 weeks,
// one column per week, Sun-Sat rows, coloured by session type. Proves
// the underlying data (date + type, going back to day one, never
// pruned) already supports this rather than just describing that it
// would.
function renderHistory(sessions, user) {
  if (sessions.length === 0) {
    return '<h3>' + esc(user.email) + ' — history</h3><div class="empty">No sessions logged yet.</div>';
  }
  var byDate = {};
  sessions.forEach(function (s) { byDate[s.date] = s; });

  var weeks = 18;
  var today = new Date(); today.setHours(0,0,0,0);
  var start = new Date(today); start.setDate(start.getDate() - (weeks * 7 - 1) - today.getDay());

  var cells = '';
  for (var d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    var key = d.toISOString().slice(0, 10);
    var s = byDate[key];
    var title = key + (s ? ' · ' + s.type : ' · rest day');
    var style = s ? 'background:' + colourFor(s.type) + ';border-color:' + colourFor(s.type) : '';
    cells += '<div class="cell" style="' + style + '" title="' + esc(title) + '"></div>';
  }

  var legend = Object.keys(SESSION_COLOUR)
    .filter(function (k, i, arr) { return arr.indexOf(k) === i; })
    .reduce(function (acc, k) { acc[SESSION_COLOUR[k]] = acc[SESSION_COLOUR[k]] || k; return acc; }, {});
  var legendHTML = Object.keys(legend).map(function (varName) {
    return '<span><span class="swatch" style="background:' + getComputedStyle(document.documentElement).getPropertyValue(varName).trim() + '"></span>' + esc(legend[varName]) + '</span>';
  }).join('');

  var recent = sessions.slice(0, 8).map(function (s) {
    return '<div class="recent-row"><span>' + fmtDate(s.date) + '</span><span class="muted">' + esc(s.type) + (s.load ? ' · ' + s.load + 'kg' : '') + '</span></div>';
  }).join('');

  return (
    '<h3>' + esc(user.email) + ' — last ' + weeks + ' weeks</h3>' +
    '<div class="grid">' + cells + '</div>' +
    '<div class="legend">' + legendHTML + '</div>' +
    '<div class="recent"><h3 style="margin-top:18px">Recent sessions</h3>' + recent + '</div>'
  );
}

// ---- Boot ----

function boot() {
  app.innerHTML = '<div class="loading">Loading…</div>';
  sb.auth.getSession().then(function (res) {
    var session = res.data.session;
    if (!session) { renderSignIn('email'); return; }
    sb.rpc('admin_user_summary').then(function (r) {
      if (r.error) {
        // Signed in, but not the admin account (or the migration in
        // SUPABASE.md hasn't been run yet) — do NOT fall back to
        // showing anything; fail closed with a clear reason.
        app.innerHTML =
          '<div class="auth">' +
            '<p class="eyebrow">Deadpoint</p><h1>Not authorized</h1>' +
            '<p>Signed in as <span class="mono">' + esc(session.user.email) + '</span>, which isn\'t the admin account — or the admin SQL in SUPABASE.md hasn\'t been run yet.</p>' +
            '<p class="error">' + esc(r.error.message) + '</p>' +
            '<button id="soBtn" style="width:100%">SIGN OUT</button>' +
          '</div>';
        document.getElementById('soBtn').onclick = function () { sb.auth.signOut().then(boot); };
        return;
      }
      renderDashboard(r.data || [], session.user.email);
    });
  });
}

boot();
</script>
</body>
</html>
