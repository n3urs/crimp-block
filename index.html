<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#181B22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Crimp Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#181B22; --s1:#1E222B; --s2:#272C37; --s3:#333947; --s4:#454C5C;
  --fg:#EDEBE5; --dim:#9AA0AE; --faint:#666C7A;
  --gorse:#F2B134; --tidepool:#4FB3A5; --slate:#7B93E0; --heather:#C9739B; --grey:#5A6069;
  --c:var(--grey); --r:3px;
  --go:#1FA24A; --rest-c:#D6383D; --ready-c:#D69A1F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Barlow',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:0 18px calc(96px + env(safe-area-inset-bottom));
  max-width:620px;margin:0 auto;
}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.top-b{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);background:var(--s1);border:1px solid var(--s3);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:left;flex:0 0 auto}
.top-b:active{border-color:var(--c)}
.top-b::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-3px;flex:0 0 auto}
.top-d{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.top-u{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--dim);background:var(--s1);border:1px solid var(--s3);border-radius:12px;padding:4px 10px 4px 8px;cursor:pointer;min-width:0;flex:0 1 auto}
.top-u span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-u i{flex:0 0 auto}
.top-u[hidden]{display:none}
.top-u i{display:block;width:6px;height:6px;border-radius:50%;background:var(--tidepool)}

/* session swipe strip + up-next, sharing a row */
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.sdots{display:flex;gap:9px;flex:0 0 auto}
.sdot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--s4);background:none;padding:0;cursor:pointer;position:relative;flex:0 0 auto}
.sdot.cur{background:var(--sc);border-color:var(--sc)}
.sdot.rec::after{content:"";position:absolute;inset:-4px;border:1.5px solid var(--sc);border-radius:50%}
.deload-badge{display:inline-block;color:var(--gorse);border:1px solid var(--gorse);border-radius:10px;padding:1px 7px;font-size:9.5px;letter-spacing:.08em;margin-left:8px;vertical-align:middle;font-family:'IBM Plex Mono',monospace}

/* compact — lives in the gap next to the session dots, not a full row */
.upnext{display:flex;align-items:center;gap:6px;cursor:pointer;min-width:0;flex:0 1 auto;justify-content:flex-end}
.un-l{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--faint);white-space:nowrap;flex:0 0 auto}
.un-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%}
.un-n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13.5px;text-transform:uppercase;color:var(--dim);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#card{touch-action:pan-y}

/* week dots */
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:4px}
.dot{height:30px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.dot i{display:block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--s4);background:none;transition:transform .12s}
.dot i.on{border-color:transparent}
.dot:active i{transform:scale(1.35)}
.dot.now i{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--s4)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:22px}
.dow span{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);letter-spacing:.02em}
.dow span.now{color:var(--dim);font-weight:600}

/* headline */
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(42px,13vw,60px);line-height:.9;text-transform:uppercase;color:var(--fg);margin-bottom:10px}
.where{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin-bottom:14px}
.why{font-size:15.5px;color:var(--dim);line-height:1.45;padding-bottom:14px}
.why:empty{display:none}

/* exercises */
.ex{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--s2)}
.tick{flex:0 0 auto;width:26px;height:26px;border:1.5px solid var(--s4);border-radius:var(--r);background:none;cursor:pointer;position:relative;margin-top:1px}
.tick[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.tick[aria-pressed="true"]::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:12px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.eb{flex:1;min-width:0}
.et{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.en{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;text-transform:uppercase;line-height:1.15}
.em{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--c);white-space:nowrap}
.em.ph{white-space:normal;text-align:right}
/* prescription + working weight, stacked right-aligned — keeps the weight
   off the title's line so long exercise names don't get squeezed */
.ep{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 1 auto;min-width:0}
.wt{background:none;border:1px solid var(--s3);color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:var(--r);cursor:pointer;white-space:nowrap;line-height:1.5}
.wt i{font-style:normal;font-size:9.5px;color:var(--faint);margin-left:2px}
.wt:active{border-color:var(--c)}
.wt.set{background:var(--s2);border-color:var(--s4);color:var(--fg)}
/* going up today — the number is the instruction, so it just looks like one */
.wt.up{border-color:var(--c);color:var(--c)}
.wt.up i{color:var(--c)}
.wt.add{border-style:dashed;color:var(--faint)}
.ed{font-size:14.5px;color:var(--dim);margin-top:4px;line-height:1.4}
/* checked off — collapses to just the struck-through title, description
   and rest timer hidden, tighter padding so the list actually gets
   shorter as you go rather than each done row taking MORE room */
.ex.checked{padding:11px 0}
.ex.checked .en{color:var(--faint);text-decoration:line-through}
.ex.checked .ep,.ex.checked .ed,.ex.checked .rest,.ex.checked .reps{display:none}
.rest{margin-top:11px;background:none;border:1px solid var(--s3);color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:var(--r);cursor:pointer}
.rest:active{border-color:var(--c);color:var(--c)}
/* Same footprint as .rest — this was rendering completely unstyled (no
   rule existed at all), which is the "looks weird and small" report. Filled
   rather than outlined, since starting the whole auto-cycling sequence is a
   bigger commitment than a plain rest countdown and should read as the
   clear call-to-action it is, not blend in the same as a passive timer. */
.reps{margin-top:11px;background:var(--c);border:none;color:var(--bg);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:var(--r);cursor:pointer}
.reps:active{filter:brightness(1.12)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 62%,rgba(24,27,34,0));padding:22px 18px calc(16px + env(safe-area-inset-bottom));z-index:40}
.bar-in{max-width:620px;margin:0 auto;display:flex;gap:9px}
.done{flex:1;background:var(--c);border:none;color:var(--bg);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.14em;text-transform:uppercase;padding:17px;border-radius:var(--r);cursor:pointer}
.done:active{filter:brightness(1.12)}

/* timer */
.tm{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--s1);border-top:1px solid var(--s3);transform:translateY(110%);transition:transform .2s;padding-bottom:env(safe-area-inset-bottom)}
.tm.on{transform:translateY(0)}
.tmbar{height:3px;background:var(--c);transform-origin:left}
.tmin{max-width:620px;margin:0 auto;padding:16px 18px;display:flex;align-items:center;gap:16px}
.tmn{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:36px;color:var(--c);line-height:1;font-variant-numeric:tabular-nums}
.tml{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmx{background:none;border:1px solid var(--s3);color:var(--dim);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:10px 16px;border-radius:var(--r);cursor:pointer}

/* celebration — brief, non-blocking, nothing to dismiss */
.celebrate{position:fixed;inset:0;z-index:70;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.celebrate.on{opacity:1}
.cel-check{width:84px;height:84px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;transform:scale(0);animation:cel-pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
.cel-check svg{width:44px;height:44px}
.cel-check path{stroke:var(--bg);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:cel-draw .35s ease .25s forwards}
@keyframes cel-pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes cel-draw{to{stroke-dashoffset:0}}
.cel-p{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:1px;background:var(--c);opacity:0}
.celebrate.on .cel-p{animation:cel-burst .7s ease-out forwards}
@keyframes cel-burst{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(var(--dist)) scale(.4)}
}
@media (prefers-reduced-motion: reduce){
  .cel-check{animation:none;transform:scale(1)}
  .cel-check path{animation:none;stroke-dashoffset:0}
}

/* interval (repeater) timer — full-screen on purpose: this runs while
   hanging off a board glancing up occasionally, not reading a sentence, so
   the colour alone has to say go/rest from across a gym. */
.ivt{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--go);opacity:0;pointer-events:none;transition:background .2s ease,opacity .15s;
  padding:24px;text-align:center}
.ivt.on{opacity:1;pointer-events:auto}
.ivt-off{background:var(--rest-c)}
.ivt-ready{background:var(--ready-c)}
.ivtx{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.22);border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1}
.ivtx:active{background:rgba(0,0,0,.35)}
.ivtl{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.ivtp{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:.92}
.ivtn{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:clamp(72px,32vw,168px);color:#fff;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0}
.ivtbarwrap{width:min(320px,80vw);height:6px;border-radius:3px;background:rgba(0,0,0,.22);overflow:hidden}
.ivtbar{width:100%;height:100%;background:#fff;transform-origin:left;transition:transform .18s linear}

/* sheet */
.bgd{position:fixed;inset:0;background:rgba(8,10,14,.78);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.bgd.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--s1);border-top:1px solid var(--s3);transform:translateY(110%);transition:transform .22s;max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.sh.on{transform:translateY(0)}
.shin{max-width:620px;margin:0 auto;padding:22px 18px 26px}
.sh h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:var(--s2);border:1px solid transparent;border-left:4px solid var(--oc);color:var(--fg);padding:16px 15px;border-radius:var(--r);cursor:pointer;margin-bottom:8px;text-align:left}
.opt:active{border-color:var(--oc)}
.optn{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;text-transform:uppercase;flex:1}
.opts{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}

/* plan sheet */
.ov-bar{display:flex;gap:4px;margin-bottom:16px}
.ov-seg{flex:1;height:7px;background:var(--s3);border-radius:2px;overflow:hidden}
.ov-seg.cur{box-shadow:0 0 0 1px var(--fg)}
.ov-seg i{display:block;height:100%;border-radius:2px}
.plan-now{background:var(--s2);border-left:3px solid var(--c);border-radius:var(--r);padding:13px 14px;margin-bottom:16px}
.plan-now-t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:9px}
.plan-now-s{font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.5;color:var(--faint);margin-top:8px}
.bar-t{height:5px;background:var(--s4);border-radius:3px;overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:3px;transition:width .3s}
.plan-h{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:20px 0 4px}
.plan-ch{padding:10px 0;border-bottom:1px solid var(--s2)}
.plan-ch-t{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plan-ch-t span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.06em;color:var(--faint);white-space:nowrap;text-transform:uppercase}
.plan-ch-m{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:3px}

/* number entry */
.num{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.num input{flex:1;background:var(--s2);border:1px solid var(--s3);color:var(--fg);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:30px;padding:14px 16px;border-radius:var(--r);text-align:center;width:100%}
.num input:focus{outline:none;border-color:var(--c)}
.num span{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--faint)}
.shp{font-size:14.5px;color:var(--faint);margin-bottom:16px;line-height:1.45}
/* weight stepper — big targets, because this gets used with chalky hands
   halfway through a set, not sat down */
.wtr{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.wtb{flex:0 0 auto;width:60px;height:60px;background:var(--s2);border:1px solid var(--s3);color:var(--fg);font-size:27px;border-radius:var(--r);cursor:pointer;line-height:1}
.wtb:active{border-color:var(--c);color:var(--c)}
.row2{display:flex;gap:9px}
.row2 button{flex:1;padding:16px;border-radius:var(--r);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.pri{background:var(--c);border:none;color:var(--bg)}
.sec{background:none;border:1px solid var(--s3);color:var(--dim)}
/* Sign-in buttons can't inherit --c: no session is showing yet, so it falls
   back to grey and the button reads as disabled. Fixed accent instead, and
   visibly dimmed until the field actually holds something valid. */
.pri.go{background:var(--gorse);color:var(--bg);transition:background .15s,color .15s}
.pri.go.off{background:var(--s3);color:var(--faint)}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.toast{position:fixed;left:18px;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:70;background:#3a1f1f;border:1px solid #7a3535;color:#f0d5d5;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.4;padding:12px 14px;border-radius:var(--r);opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .2s,transform .2s;max-width:620px;margin:0 auto}
.toast.on{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <button class="top-b" id="topB" aria-label="Show the plan">—</button>
  <span class="top-u" id="topU" hidden><i></i><span id="topUe"></span></span>
  <span class="top-d" id="topD"></span>
</div>
<div class="dots" id="dots"></div>
<div class="dow" id="dow"></div>
<div class="srow">
  <div class="sdots" id="sdots"></div>
  <div class="upnext" id="upnext"></div>
</div>

<div id="card">
<h1 id="h1">—</h1>
<div class="where" id="where"></div>
<div class="why" id="why"></div>
<div id="list"></div>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <button class="done" id="doneBtn">Done</button>
  </div>
</div>

<div class="tm" id="tm">
  <div class="tmbar" id="tmBar"></div>
  <div class="tmin">
    <span class="tmn" id="tmN">0:00</span>
    <span class="tml" id="tmL"></span>
    <button class="tmx" id="tmX">Stop</button>
  </div>
</div>

<div class="celebrate" id="celebrate"></div>

<div class="ivt" id="ivt">
  <button class="ivtx" id="ivtX" aria-label="Stop">✕</button>
  <div class="ivtl" id="ivtL"></div>
  <div class="ivtp" id="ivtP"></div>
  <div class="ivtn" id="ivtN">0:00</div>
  <div class="ivtbarwrap"><div class="ivtbar" id="ivtBar"></div></div>
</div>

<div class="bgd" id="bgd"></div>
<div class="sh" id="sh"><div class="shin" id="shIn"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
